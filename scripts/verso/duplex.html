<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Experiências das Redes de Ensino — verso duplex</title>
    <style>
      @page {
        size: 210mm 297mm;
        margin: 0;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 210mm;
        height: 297mm;
        background: #493975;
      }

      body {
        overflow: hidden;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .sheet {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: #493975;
      }

      /*
       * Uma única arte cobre a folha inteira: o padrão atravessa a linha de
       * corte sem emenda. Cada card recebe um logo no seu centro.
       */
      .pattern {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }

      .veil {
        position: absolute;
        left: 0;
        width: 100%;
        height: 148.5mm;
        background: radial-gradient(
          ellipse 66% 92% at 50% 50%,
          rgba(73, 57, 117, 0.97) 0 32%,
          rgba(73, 57, 117, 0.62) 58%,
          rgba(73, 57, 117, 0) 82%
        );
      }

      .veil-top {
        top: 0;
      }

      .veil-bottom {
        top: 148.5mm;
      }

      .logo {
        position: absolute;
        left: 50%;
        width: 58%;
        height: auto;
        transform: translate(-50%, -50%);
      }

      .logo-top {
        top: 74.25mm;
      }

      .logo-bottom {
        top: 222.75mm;
      }

      /* Última folha: só o card de cima; a metade de baixo fica branca. */
      .mask {
        display: none;
        position: absolute;
        left: 0;
        top: 151.5mm;
        width: 100%;
        height: 145.5mm;
        background: #ffffff;
      }

      body.single .mask {
        display: block;
      }

      body.single .veil-bottom,
      body.single .logo-bottom {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="sheet">
      <img class="pattern" src="../../src/assets/verso/vozes-grafismo.png" alt="" aria-hidden="true" />
      <div class="veil veil-top"></div>
      <div class="veil veil-bottom"></div>
      <img class="logo logo-top" src="../../src/assets/verso/vozes-assinatura-branca.svg" alt="Vozes da educação" />
      <img class="logo logo-bottom" src="../../src/assets/verso/vozes-assinatura-branca.svg" alt="" aria-hidden="true" />
      <div class="mask"></div>
    </div>
  </body>
</html>
