<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  O fontconfig embutido no LibreOffice não lê as pastas de fontes do macOS.
  Sem este arquivo, toda a apresentação cai numa serifa de fallback e a prévia
  mente sobre a tipografia. Ao renderizar, aponte FONTCONFIG_FILE para cá.
-->
<fontconfig>
  <dir>/System/Library/Fonts</dir>
  <dir>/System/Library/Fonts/Supplemental</dir>
  <dir>/Library/Fonts</dir>
  <dir>~/Library/Fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir>/opt/homebrew/share/fonts</dir>

  <cachedir>~/Library/Caches/org.fontconfig</cachedir>

  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="assign" binding="same"><string>Helvetica</string></edit>
  </match>
</fontconfig>
